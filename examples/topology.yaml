# Example DiDAQt topology for the FABRIC experiment.
#
# 10 senders → 1 switch (Tofino 2) → 2 receivers
#
# Initial configuration: all 10 senders route to receiver R0.
# Receiver R1 is available as a failover target.
#
# Port layout on the switch:
#   Port 1: connected to sender node (all 10 senders share this link)
#   Port 2: (spare sender link for future use)
#   Port 3: connected to receiver R0
#   Port 4: connected to receiver R1

- name: S1
  type: sender
  sender_id: 1
  sender_id_bytes: 26
  max_bandwidth: 10G
  initial_receiver: R0
  group_id: 0
  connections:
    1:
      other_node: SW1
      other_port: 1
      max_bandwidth: 100G
      initial_connections:
        1:
          sender: S1
          receiver: R0

